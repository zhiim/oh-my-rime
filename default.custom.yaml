patch:
  # 只使用小鹤双拼和白霜拼音
  schema_list:
    - schema: double_pinyin_flypy  # 小鹤双拼
    - schema: rime_mint            # 薄荷拼音
  menu/page_size: 8  # 候选词个数
  key_binder/bindings:
    # 候选词菜单换页
    - { when: composing, accept: Control+p, send: Up }     # composing 时,Control+p 等同于 Up 键
    - { when: composing, accept: Control+n, send: Down }
    - { when: paging, accept: comma, send: Page_Up }             # 候选窗口翻页
    - { when: has_menu, accept: period, send: Page_Down }
    - { when: predicting, accept: comma, send: comma }           # 在预编码模式下,不当作快捷键
    - { when: predicting, accept: period, send: period }
    # 常用切换快捷键
    - { when: always, accept: Control+Shift+F, toggle: transcription } # 切换简体/繁体
    - { when: always, accept: Control+Shift+period, toggle: ascii_mode } # 切换中/西文模式
    - { when: always, accept: Shift+space, toggle: full_shape } # 切换全角/半角的方式
  ascii_composer/switch_key:
    Caps_Lock: commit_code  # 按下 Caps Lock 会直接上屏
    Control_L: commit_code  # 按下左 Control 键会切换到西文模式
    Control_R: noop  # 按下右 Control 键不做任何操作
    Shift_L: noop  # 按下左 Shift 键不做任何操作
    Shift_R: noop  # 按下右 Shift 键不做任何操作
